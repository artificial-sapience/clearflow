[build-system]
requires = ["hatchling >= 1.27"]
build-backend = "hatchling.build"

[project]
name = "stigmergic"
version = "0.0.1"  # Early alpha
description = "Stigmergic coordination for AI agents through environmental signals"
authors = [
  {name = "Richard Beauchamp", email = "rbeauchamp@users.noreply.github.com"}
]
maintainers = [
  {name = "Stigmergic Contributors"}
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.13"

keywords = [
    "stigmergy", "coordination", "multi-agent", "swarm-intelligence",
    "environmental-communication", "ai-agents", "emergence", "dspy",
    "signal-based", "decentralized", "self-organization"
]

classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]

dependencies = [
    "pydantic>=2.11.0",
    "dspy>=2.5.0",
]

[project.optional-dependencies]
vector = [
    "chromadb>=0.5.0",
]
full = [
    "chromadb>=0.5.0",
    "openai>=1.107.0",  # For embeddings
]

[project.urls]
Homepage = "https://github.com/artificial-sapience/clearflow"
Repository = "https://github.com/artificial-sapience/clearflow.git"
Source = "https://github.com/artificial-sapience/clearflow/tree/main/packages/stigmergic"
Issues = "https://github.com/artificial-sapience/clearflow/issues"
Documentation = "https://github.com/artificial-sapience/clearflow/tree/main/docs"

[tool.hatch.build]
# Exclude test files from package distributions
exclude = [
  "tests/",
  "examples/",
  "*.md",
]

[tool.hatch.build.targets.wheel]
packages = ["stigmergic"]