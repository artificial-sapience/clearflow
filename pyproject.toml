# Root workspace configuration for uv
[tool.uv.workspace]
members = ["packages/clearflow", "packages/stigmergic"]

[tool.uv.sources]
clearflow = { workspace = true }
stigmergic = { workspace = true }

# Workspace-level metadata (not published to PyPI)
[project]
name = "clearflow-workspace"
version = "0.0.0"
description = "Monorepo workspace for ClearFlow and Stigmergic coordination systems"
requires-python = ">=3.13"
readme = "README.md"
dependencies = [
    "clearflow",
    "stigmergic",
]

# Shared development dependencies for all packages
[project.optional-dependencies]
dev = [
    "pytest>=8.3.5",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "pytest-timeout>=2.3.1",
    "ruff>=0.8.7",
    "pyright>=1.1.394",
    "xenon>=0.9.1",
    "vulture>=2.14",
    "radon>=6.0.1",
    "bandit[toml]>=1.8.0",
    "pip-audit>=2.8.0",
]
examples = [
    # Dependencies for clearflow examples
    "openai>=1.107.0",
    "python-dotenv>=1.1.0",
    "faiss-cpu>=1.12.0",
    "numpy>=2.3.0",
]

# Ruff configuration (shared across workspace)
[tool.ruff]
target-version = "py313"
line-length = 120
indent-width = 4
preview = true
fix = true
extend-exclude = ["*.ipynb", "typings", "**/.venv", "**/venv"]
unsafe-fixes = false

[tool.ruff.lint]
select = [
    "ALL",  # Enable all rules
]
ignore = [
    # Docstring conflicts (must choose one)
    "D203",  # 1 blank line required before class docstring (conflicts with D211)
    "D213",  # Multi-line docstring summary should start at the second line (conflicts with D212)

    # Formatter conflicts that cannot be resolved
    "COM812",  # Missing trailing comma (conflicts with formatter)
    "ISC001",  # Implicitly concatenated string literals (conflicts with formatter)

    # Line length - let formatter handle this
    "E501",  # Line too long (trust formatter's judgment)

    # Copyright headers not standard in Python ecosystem
    "CPY001",  # Missing copyright notice at top of file

    # Documentation rules we handle through review
    "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107",
    "D401", "D415", "D417",

    # Overly strict or unnecessary
    "TD002", "TD003",    # TODO formatting
    "FIX002",            # TODO resolution
    "ERA001",            # Commented code (needed for examples)
    "T201",              # Print statements (needed in examples)
    "PLR2004",           # Magic numbers
    "PLR0913",           # Too many arguments (needed for complex flows)
]

# Never allow fixes for imports that may change execution order
unfixable = ["F401", "E402", "C408"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "ARG001", "PLR0913", "PLR0917", "S311", "SLF001"]
"**/tests/*" = ["S101", "ARG001", "PLR0913", "PLR0917", "S311", "SLF001"]
"packages/*/tests/*" = ["S101", "ARG001", "PLR0913", "PLR0917", "S311", "SLF001", "INP001"]
"examples/*" = ["INP001", "T201", "ANN401", "EXE001"]
"**/examples/*" = ["INP001", "T201", "ANN401", "EXE001"]
"packages/*/examples/*" = ["INP001", "T201", "ANN401", "EXE001"]
"linters/*" = ["INP001", "T201"]

[tool.ruff.format]
preview = true
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint.pycodestyle]
# More lenient line length for edge cases (URLs, long strings, etc.)
max-line-length = 120

# Pyright configuration (shared across workspace)
[tool.pyright]
include = ["packages/clearflow", "packages/stigmergic", "linters"]
exclude = ["**/node_modules", "**/__pycache__", "**/.*", "build", "dist"]
pythonVersion = "3.13"
pythonPlatform = "All"
typeCheckingMode = "strict"
reportMissingImports = true
reportMissingTypeStubs = false
reportPrivateUsage = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportUnknownParameterType = false
reportAny = false

# Bandit security configuration
[tool.bandit]
exclude_dirs = ["tests", ".venv", "venv", "build", "dist"]
skips = ["B101", "B601"]  # Allow asserts and shell usage in controlled contexts

# Coverage configuration
[tool.coverage.run]
source = ["packages/clearflow/clearflow", "packages/stigmergic/stigmergic"]
branch = true
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/.*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "@abc.abstractmethod",
    "Protocol",
]

# Pytest configuration
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["packages/clearflow/tests", "packages/stigmergic/tests"]
python_files = ["test_*.py"]